server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32m;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ ^/(api/|docs$|openapi\.json$) {
        # Docker's DNS is re-resolved when API is recreated during an update.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 390s;
        proxy_send_timeout 390s;
        # Access URLs can contain user resource IDs; structured API logs suffice.
        access_log off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
