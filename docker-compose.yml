services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyrag_dev}
      POSTGRES_DB: ${POSTGRES_DB:-studyrag}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyrag} -d ${POSTGRES_DB:-studyrag}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    image: studyrag-backend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
      target: runtime
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.13.1}
    env_file: ${APP_ENV_FILE:-.env}
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studyrag}:${POSTGRES_PASSWORD:-studyrag_dev}@postgres:5432/${POSTGRES_DB:-studyrag}
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
      MODEL_CACHE_DIR: /data/models
      AUTH_SECRET: ${AUTH_SECRET:-change-this-local-development-secret}
    volumes: &app_volumes
      - app_storage:/data/storage
      - model_cache:/data/models
    command: [alembic, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    profiles: [app]
    image: studyrag-backend:${IMAGE_TAG:-local}
    env_file: ${APP_ENV_FILE:-.env}
    environment: *app_environment
    volumes: *app_volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    stop_grace_period: 390s

  worker:
    profiles: [app]
    image: studyrag-backend:${IMAGE_TAG:-local}
    env_file: ${APP_ENV_FILE:-.env}
    environment: *app_environment
    volumes: *app_volumes
    command: [celery, -A, "app.workers.tasks:celery_app", worker, --loglevel=info, --concurrency=1]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "celery -A app.workers.tasks:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 3 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 390s

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:stable-alpine}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  app_storage:
  model_cache:

